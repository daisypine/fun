<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warped Long Beach 2026 — My Lineup</title>
<style>
  :root{
    --sky:#3BA4E0;
    --deep:#123B7A;
    --ink:#0B1F3F;
    --pop:#FFD429;
    --hot:#E8402A;
    --foam:#F2F7FB;
    --line:rgba(11,31,63,.14);
    --must:#E8402A;
    --want:#FFD429;
    --songs:#3BC4A7;
    --nah:#8FA3BC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 14px,rgba(255,255,255,0) 14px 28px),
      linear-gradient(180deg,#8FD3F4 0%,#5FB4E8 40%,#3BA4E0 100%);
    background-attachment:fixed;
    padding-bottom:96px;
  }
  .display{
    font-family:"Haettenschweiler","Arial Narrow",Impact,"Anton",sans-serif;
    font-weight:900;letter-spacing:.02em;text-transform:uppercase;
    -webkit-text-stroke:0;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 12px}

  /* ---- header ---- */
  header{
    background:var(--deep);
    border-bottom:5px solid var(--pop);
    padding:14px 12px 12px;
    position:relative;overflow:hidden;
  }
  .checker{
    position:absolute;inset:auto 0 0 0;height:0;
  }
  .logo{
    display:inline-block;background:var(--hot);color:#fff;
    padding:4px 12px 6px;border-radius:999px;font-size:15px;letter-spacing:.14em;
    transform:rotate(-2deg);
  }
  h1{
    margin:8px 0 2px;color:var(--pop);font-size:38px;line-height:.88;
    text-shadow:3px 3px 0 var(--hot);
  }
  h1 span{display:block;color:#fff;font-size:26px;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
  .sub{color:#BBD9F5;font-size:12px;letter-spacing:.18em;margin-top:8px}

  /* ---- sticky controls ---- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:var(--deep);
    border-bottom:4px solid var(--pop);
    padding:8px 12px 10px;
  }
  .days{display:flex;gap:6px}
  .day{
    flex:1;padding:9px 4px;border:0;border-radius:8px;
    background:rgba(255,255,255,.12);color:#CFE5F8;
    font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  }
  .day.on{background:var(--pop);color:var(--ink)}
  .searchrow{display:flex;gap:6px;margin-top:8px}
  input[type=search]{
    flex:1;min-width:0;padding:9px 12px;border:0;border-radius:8px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .ghost{
    border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;
    border-radius:8px;padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.06em;
    font-family:inherit;text-transform:uppercase;
  }
  .chips{display:flex;gap:5px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;border:0;border-radius:999px;padding:6px 11px;
    font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    background:rgba(255,255,255,.14);color:#DCEBF9;
  }
  .chip.on{background:#fff;color:var(--ink)}
  .chip .n{opacity:.6;margin-left:5px}

  /* ---- list ---- */
  .letter{
    margin:16px 0 6px;color:#fff;font-size:13px;letter-spacing:.2em;
    text-shadow:1px 1px 0 rgba(0,0,0,.25);
  }
  .card{
    background:var(--foam);border-radius:12px;margin-bottom:8px;
    box-shadow:0 2px 0 rgba(11,31,63,.25);
    border-left:8px solid transparent;overflow:hidden;
  }
  .card[data-tier=must]{border-left-color:var(--must)}
  .card[data-tier=want]{border-left-color:var(--pop)}
  .card[data-tier=songs]{border-left-color:var(--songs)}
  .card[data-tier=nah]{border-left-color:var(--nah);opacity:.62}
  .top{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px}
  .name{
    flex:1;font-size:19px;line-height:1;letter-spacing:.01em;
    font-family:"Haettenschweiler","Arial Narrow",Impact,sans-serif;font-weight:900;text-transform:uppercase;
  }
  .card[data-tier=nah] .name{text-decoration:line-through}
  .seen{
    border:2px solid var(--line);background:#fff;border-radius:7px;
    width:34px;height:34px;font-size:15px;line-height:1;flex:0 0 auto;
  }
  .seen.on{background:var(--songs);border-color:var(--songs);color:#fff}
  .tiers{display:flex;gap:4px;padding:0 10px 10px 12px}
  .t{
    flex:1;padding:8px 2px;border:2px solid var(--line);background:#fff;border-radius:7px;
    font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#5A6E8A;
  }
  .t.on{color:#fff;border-color:transparent}
  .t[data-t=must].on{background:var(--must)}
  .t[data-t=want].on{background:var(--pop);color:var(--ink)}
  .t[data-t=songs].on{background:var(--songs)}
  .t[data-t=nah].on{background:var(--nah)}
  .timerow{display:flex;gap:6px;padding:0 10px 8px 12px;align-items:center}
  .timerow input{
    border:2px solid var(--line);border-radius:7px;padding:7px 8px;font-family:inherit;
    font-size:15px;color:var(--ink);background:#fff;min-width:0;
  }
  .timerow input[type=time]{flex:0 0 108px}
  .timerow input.stage{flex:1}
  .clash{
    display:block;margin:0 10px 8px 12px;background:var(--hot);color:#fff;border-radius:6px;
    padding:6px 8px;font-size:12px;font-weight:700;letter-spacing:.02em;
  }
  .noterow{padding:0 10px 10px 12px}
  textarea{
    width:100%;border:2px dashed var(--line);border-radius:7px;background:#fff;
    padding:8px;font-family:inherit;font-size:14px;color:var(--ink);resize:vertical;min-height:44px;
  }
  .notehint{font-size:11px;color:#6B7F99;margin:4px 2px 0;letter-spacing:.02em}
  .empty{background:var(--foam);border-radius:12px;padding:22px 16px;text-align:center;color:#4B617F}

  /* ---- plan sheet ---- */
  .fab{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--deep);border-top:4px solid var(--pop);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;justify-content:center;
  }
  .fab button{
    flex:1;max-width:340px;padding:12px;border:0;border-radius:10px;background:var(--hot);color:#fff;
    font-family:"Haettenschweiler","Arial Narrow",Impact,sans-serif;font-size:17px;letter-spacing:.06em;text-transform:uppercase;
  }
  .sheet{
    position:fixed;inset:0;z-index:40;background:var(--deep);overflow:auto;display:none;
    padding:16px 12px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet.open{display:block}
  .sheet h2{color:var(--pop);font-size:30px;margin:0 0 2px;font-family:"Haettenschweiler","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
  .sheet h3{color:#fff;font-size:14px;letter-spacing:.16em;margin:18px 0 6px;text-transform:uppercase}
  .planline{background:rgba(255,255,255,.94);border-radius:8px;padding:8px 10px;margin-bottom:5px;font-size:14px}
  .planline b{font-family:"Haettenschweiler","Arial Narrow",Impact,sans-serif;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
  .planline i{display:block;font-style:normal;color:#40566F;font-size:13px;margin-top:2px}
  .sheetbar{display:flex;gap:8px;margin-top:16px}
  .sheetbar button{flex:1;padding:11px;border:0;border-radius:9px;font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .close{position:sticky;top:0;float:right;background:var(--hot);color:#fff;border:0;border-radius:999px;width:38px;height:38px;font-size:20px}
  .savenote{color:#9FC6E8;font-size:11px;text-align:center;padding:10px 0 0;letter-spacing:.08em}
  @media (prefers-reduced-motion:no-preference){
    .card{transition:border-color .15s ease,opacity .15s ease}
  }
</style>

<header>
  <div class="wrap">
    <div class="logo display">Vans</div>
    <h1 class="display">Warped<span>Long Beach</span></h1>
    <div class="sub display">July 25–26 · 2026 · Shoreline Waterfront</div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="days">
      <button class="day on" data-day="sat">Sat 7/25</button>
      <button class="day" data-day="sun">Sun 7/26</button>
      <button class="day" data-day="all">Both</button>
    </div>
    <div class="searchrow">
      <input type="search" id="q" placeholder="Search bands…" autocomplete="off">
      <button class="ghost" id="sort">A–Z</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="wrap" id="list"></div>
<div class="savenote" id="status">Saves to this phone as you tap. Add to Home Screen for festival day.</div>

<div class="fab"><button id="openplan" class="display">My plan</button></div>

<div class="sheet" id="sheet">
  <div class="wrap">
    <button class="close" id="closeplan">×</button>
    <h2>My plan</h2>
    <div id="plan"></div>
    <div class="sheetbar">
      <button id="copy" style="background:var(--pop);color:var(--ink)">Copy as text</button>
      <button id="backup" style="background:#fff;color:var(--ink)">Back up my picks</button>
    </div>
    <div class="sheetbar">
      <button id="restorebtn" style="background:rgba(255,255,255,.15);color:#fff">Restore a backup</button>
      <button id="reset" style="background:rgba(255,255,255,.15);color:#fff">Clear all picks</button>
    </div>
    <input type="file" id="restorefile" accept="application/json" hidden>
  </div>
</div>

<script>
const SAT = ["3OH!3","All Time Low","Allison","Aries","Arm's Length","Attila","Bear vs. Shark","Beauty School Dropout","Big Ass Truck I.E.","BLNKO","Bowling For Soup","Brayton","Caskets","Chase Petra","Citizen","Dance Gavin Dance","DeathbyRomy","Dinosaur Pile-Up","Drop Dead, Gorgeous","Emery","Escape The Fate","Fox Lake","Games We Play","Girlfriends","Good Sleepy","Good Terms","grandson","Gritty In Pink Jam","Gym Class Heroes","Holy Wars","Honey Revenge","Hoobastank","Hot Chelle Rae","Hot Mulligan","Initiate","Ivy Pacific","Jimmy Eat World","Jinjer","Joyce Manor","Jutes","Lakeview","Lø Spirit","LOLO","Magnolia Park","Norma Jean","Oxymorrons","Pain Of Truth","Phantom Planet","Plain White T's","Red Leather","Reel Big Fish","Sace6","Set It Off","Simple Plan","Slay Squad","Sleeping With Sirens","South Arcade","Stand Atlantic","Suicide Silence","The Devil Wears Prada","The Early November","The Expendables","The Ghost Inside","The Story So Far","The Summer Set","The Wrecks","Trxvis","Underoath","Upon A Burning Body","Vana","Vienna Vienna","Wesghost","Whispers","Who Cares","Winona Fighter","Yelawolf"];
const SUN = ["Acceptance","Alemeda","Alexisonfire","Amigo The Devil","Bad Cop Bad Cop","Bayside","Boston Manor","Boundaries","Breathe Carolina","carolesdaughter","Codefendants","Crown The Empire","Daisy Grenade","Delux","DENM","División Minúscula","Doobie","Drain","Dying Wish","Fame On Fire","Free Throw","From First To Last","G-Eazy","Glassjaw","Guilt Trip","Hawthorne Heights","Haywire","Hepcat","Hot Milk","I Set My Friends On Fire","Jiluka","KennyHoopla","Lagwagon","Leisure Hour","letlive.","Lower Definition","Mad Caddies","Mayday Parade","Meet Me @ The Altar","Millington","Motion City Soundtrack","Mutant Beans","MxPx","Nova Twins","Origami Angel","Papa Roach","Peelingflesh","People R Ugly","Raue","rosecoloredworld","Sammy Adams","Save Ferris","Scarlet House","Scary Kids Scaring Kids","Set Your Goals","Shakewell","Silverstein","Start Today","Story Of The Year","Surfer Girl","Taking Back Sunday","The Academy Is...","The Aggrolites","The Ataris","The Cab","The Paradox","The Starting Line","The Used","Third Eye Blind","Thrice","Tillie","Villanelle","Waterparks","We Came As Romans","XCOMM"];

const BANDS = [...SAT.map(n=>({n,d:"sat"})), ...SUN.map(n=>({n,d:"sun"}))];
const TIERS = [
  {k:"must",  label:"Must see",  short:"★ Must"},
  {k:"want",  label:"Would like",short:"◆ Want"},
  {k:"songs", label:"Know 1–2", short:"♪ 1–2"},
  {k:"nah",   label:"Skip",      short:"✕ Skip"}
];
const KEY = "warped-lb-2026:v1";
let state = {tier:{}, note:{}, seen:{}, time:{}, stage:{}};
let ui = {day:"sat", filter:"all", q:"", sort:"az"};

/* ---------- storage ----------
   Two homes: window.storage when this runs inside Claude, the browser's own
   store when it's a downloaded file opened in Safari/Chrome. Whichever exists. */
const hasAppStore = typeof window.storage !== "undefined";
let saveMode = "none";

async function load(){
  if(hasAppStore){
    try{
      const r = await window.storage.get(KEY);
      if(r && r.value) state = Object.assign(state, JSON.parse(r.value));
      saveMode = "app";
      return;
    }catch(e){ saveMode = "app"; return; } // nothing saved yet, still writable
  }
  try{
    const raw = window.localStorage.getItem(KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
    window.localStorage.setItem(KEY+":test","1");
    window.localStorage.removeItem(KEY+":test");
    saveMode = "local";
  }catch(e){ saveMode = "none"; }
}

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  setStatus("Saving…");
  saveTimer = setTimeout(async ()=>{
    const payload = JSON.stringify(state);
    try{
      if(saveMode==="app") await window.storage.set(KEY, payload);
      else if(saveMode==="local") window.localStorage.setItem(KEY, payload);
      else throw new Error("no storage available");
      setStatus("Saved " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
    }catch(e){
      setStatus("Not saving — use Back up my picks in My plan");
    }
  }, 250);
}
function setStatus(msg){
  const el = document.getElementById("status");
  if(el) el.textContent = msg;
}

/* Backup: writes everything to a file you can keep or re-import. */
function backup(){
  const blob = new Blob([JSON.stringify(state,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "warped-2026-picks.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function restore(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      state = Object.assign({tier:{},note:{},seen:{},time:{},stage:{}}, JSON.parse(fr.result));
      save(); render(); renderPlan();
    }catch(e){ setStatus("That file didn't read as a backup"); }
  };
  fr.readAsText(file);
}

/* ---------- set times ---------- */
function mins(band){
  const v = state.time[band];
  if(!v) return null;
  const m = v.match(/^(\d{1,2}):(\d{2})$/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function pretty(band){
  const t = mins(band); if(t===null) return "";
  let h = Math.floor(t/60), mm = String(t%60).padStart(2,"0");
  const ap = h>=12 ? "PM" : "AM"; h = h%12 || 12;
  return `${h}:${mm} ${ap}`;
}
// Two bands you care about, starting within 30 minutes of each other, on the same day.
function clashes(){
  const map = {};
  ["sat","sun"].forEach(d=>{
    const timed = BANDS.filter(x=>x.d===d && mins(x.n)!==null &&
      ["must","want","songs"].includes(state.tier[x.n]));
    timed.forEach(a=>timed.forEach(b=>{
      if(a.n===b.n) return;
      if(Math.abs(mins(a.n)-mins(b.n)) < 30){
        (map[a.n] = map[a.n] || []).push(b.n);
      }
    }));
  });
  return map;
}

/* ---------- render ---------- */
const listEl = document.getElementById("list");
const chipsEl = document.getElementById("chips");

function visible(){
  let b = BANDS.filter(x => ui.day==="all" || x.d===ui.day);
  if(ui.q) b = b.filter(x => x.n.toLowerCase().includes(ui.q));
  if(ui.filter==="unset") b = b.filter(x => !state.tier[x.n]);
  else if(ui.filter!=="all") b = b.filter(x => state.tier[x.n]===ui.filter);
  if(ui.sort==="tier"){
    const rank = {must:0,want:1,songs:2,nah:4};
    b = [...b].sort((x,y)=>(rank[state.tier[x.n]] ?? 3)-(rank[state.tier[y.n]] ?? 3) || x.n.localeCompare(y.n));
  } else if(ui.sort==="time"){
    b = [...b].sort((x,y)=>{
      const a = mins(x.n), c = mins(y.n);
      if(a===null && c===null) return x.n.localeCompare(y.n);
      if(a===null) return 1;
      if(c===null) return -1;
      return a-c || x.n.localeCompare(y.n);
    });
  }
  return b;
}

function counts(){
  const pool = BANDS.filter(x => ui.day==="all" || x.d===ui.day);
  const c = {all:pool.length, unset:0};
  TIERS.forEach(t=>c[t.k]=0);
  pool.forEach(x=>{ const t=state.tier[x.n]; if(t) c[t]++; else c.unset++; });
  return c;
}

function renderChips(){
  const c = counts();
  const defs = [{k:"all",l:"All"},...TIERS.map(t=>({k:t.k,l:t.short})),{k:"unset",l:"Undecided"}];
  chipsEl.innerHTML = defs.map(d=>
    `<button class="chip ${ui.filter===d.k?"on":""}" data-f="${d.k}">${d.l}<span class="n">${c[d.k]}</span></button>`
  ).join("");
}

function renderList(){
  const b = visible();
  if(!b.length){
    listEl.innerHTML = `<div class="letter display">Nothing here</div>
      <div class="empty">No bands match that. Clear the search or pick a different filter.</div>`;
    return;
  }
  const clash = clashes();
  let html = "", lastDay = null;
  b.forEach(x=>{
    if(ui.day==="all" && x.d!==lastDay){
      lastDay = x.d;
      html += `<div class="letter display">${x.d==="sat"?"Saturday 7/25":"Sunday 7/26"}</div>`;
    }
    const t = state.tier[x.n] || "";
    const note = state.note[x.n] || "";
    const seen = state.seen[x.n];
    const id = encodeURIComponent(x.n);
    html += `<div class="card" data-tier="${t}" data-band="${id}">
      <div class="top">
        <div class="name">${x.n}</div>
        <button class="seen ${seen?"on":""}" data-act="seen" title="Saw them">${seen?"✓":"○"}</button>
      </div>
      <div class="tiers">
        ${TIERS.map(tr=>`<button class="t ${t===tr.k?"on":""}" data-t="${tr.k}" data-act="tier">${tr.label}</button>`).join("")}
      </div>
      <div class="timerow">
        <input type="time" data-act="time" value="${state.time[x.n]||""}" aria-label="Set time">
        <input class="stage" type="text" data-act="stage" value="${(state.stage[x.n]||"").replace(/"/g,"&quot;")}" placeholder="Stage" aria-label="Stage">
      </div>
      ${clash[x.n] ? `<div class="clash">Overlaps ${[...new Set(clash[x.n])].join(", ")}</div>` : ""}
      <div class="noterow">
        <textarea data-act="note" placeholder="Songs to catch, notes, merch to grab…">${note.replace(/</g,"&lt;")}</textarea>
      </div>
    </div>`;
  });
  listEl.innerHTML = html;
}

function render(){ renderChips(); renderList(); }

/* ---------- events ---------- */
document.querySelectorAll(".day").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".day").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on"); ui.day = btn.dataset.day; render();
});
chipsEl.onclick = e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  ui.filter = c.dataset.f; render();
};
document.getElementById("q").oninput = e=>{ ui.q = e.target.value.trim().toLowerCase(); renderList(); };
document.getElementById("sort").onclick = e=>{
  const order = ["az","tier","time"];
  const labels = {az:"A–Z", tier:"By tier", time:"By time"};
  ui.sort = order[(order.indexOf(ui.sort)+1) % order.length];
  e.target.textContent = labels[ui.sort];
  renderList();
};
listEl.addEventListener("click", e=>{
  const btn = e.target.closest("button"); if(!btn) return;
  const card = btn.closest(".card"); const band = decodeURIComponent(card.dataset.band);
  if(btn.dataset.act==="tier"){
    state.tier[band] = state.tier[band]===btn.dataset.t ? undefined : btn.dataset.t;
    if(!state.tier[band]) delete state.tier[band];
  } else if(btn.dataset.act==="seen"){
    state.seen[band] = !state.seen[band];
    if(!state.seen[band]) delete state.seen[band];
  }
  save(); render();
});
listEl.addEventListener("input", e=>{
  const act = e.target.dataset.act;
  if(!["note","time","stage"].includes(act)) return;
  const band = decodeURIComponent(e.target.closest(".card").dataset.band);
  const store = {note:"note", time:"time", stage:"stage"}[act];
  state[store][band] = e.target.value;
  if(!e.target.value) delete state[store][band];
  save();
});
listEl.addEventListener("change", e=>{
  if(e.target.dataset.act==="time") renderList();  // refresh overlap warnings
});

/* ---------- plan sheet ---------- */
const sheet = document.getElementById("sheet");
function planText(){
  let out = "WARPED LONG BEACH 2026 — my plan\n";
  [["sat","SATURDAY 7/25"],["sun","SUNDAY 7/26"]].forEach(([d,label])=>{
    out += `\n${label}\n`;
    TIERS.filter(t=>t.k!=="nah").forEach(t=>{
      const rows = BANDS.filter(x=>x.d===d && state.tier[x.n]===t.k);
      if(!rows.length) return;
      out += `  ${t.label.toUpperCase()}\n`;
      rows.forEach(x=>{
        const when = pretty(x.n);
        out += `   - ${when?when+" ":""}${x.n}${state.stage[x.n]?" @ "+state.stage[x.n]:""}${state.seen[x.n]?" [saw them]":""}${state.note[x.n]?` — ${state.note[x.n]}`:""}\n`;
      });
    });
  });
  const support = BANDS.filter(x=>state.seen[x.n]);
  if(support.length) out += `\nSUPPORT AFTER (${support.length})\n` + support.map(x=>`   - ${x.n}${state.note[x.n]?` — ${state.note[x.n]}`:""}`).join("\n") + "\n";
  return out;
}
function renderPlan(){
  const el = document.getElementById("plan");
  const clash = clashes();
  let html = "";
  ["sat","sun"].forEach(d=>{
    const timed = BANDS.filter(x=>x.d===d && mins(x.n)!==null && state.tier[x.n] && state.tier[x.n]!=="nah")
                       .sort((a,b)=>mins(a.n)-mins(b.n));
    if(!timed.length) return;
    html += `<h3>Running order — ${d==="sat"?"Saturday 7/25":"Sunday 7/26"}</h3>`;
    timed.forEach(x=>{
      html += `<div class="planline"><b>${pretty(x.n)} · ${x.n}</b>` +
        (state.stage[x.n]?` <i>${state.stage[x.n].replace(/</g,"&lt;")}</i>`:"") +
        (clash[x.n]?`<i style="color:#C0301C">Overlaps ${[...new Set(clash[x.n])].join(", ")}</i>`:"") +
        (state.note[x.n]?`<i>${state.note[x.n].replace(/</g,"&lt;")}</i>`:"") + `</div>`;
    });
  });
  [["sat","Saturday 7/25"],["sun","Sunday 7/26"]].forEach(([d,label])=>{
    const picked = BANDS.filter(x=>x.d===d && state.tier[x.n] && state.tier[x.n]!=="nah");
    html += `<h3>${label} — ${picked.length} picked</h3>`;
    if(!picked.length){ html += `<div class="planline">Nothing picked yet. Tap a tier on any band to start.</div>`; }
    TIERS.filter(t=>t.k!=="nah").forEach(t=>{
      const rows = BANDS.filter(x=>x.d===d && state.tier[x.n]===t.k);
      if(!rows.length) return;
      html += `<h3 style="color:var(--pop);font-size:12px;margin:10px 0 4px">${t.label} (${rows.length})</h3>`;
      rows.forEach(x=>{
        html += `<div class="planline"><b>${x.n}</b>${state.seen[x.n]?" ✓":""}${state.note[x.n]?`<i>${state.note[x.n].replace(/</g,"&lt;")}</i>`:""}</div>`;
      });
    });
  });
  const support = BANDS.filter(x=>state.seen[x.n]);
  html += `<h3>Support after (${support.length})</h3>`;
  html += support.length
    ? support.map(x=>`<div class="planline"><b>${x.n}</b>${state.note[x.n]?`<i>${state.note[x.n].replace(/</g,"&lt;")}</i>`:""}</div>`).join("")
    : `<div class="planline">Check the circle on a band once you've seen them. They land here so you know who to stream and buy merch from.</div>`;
  el.innerHTML = html;
}
document.getElementById("openplan").onclick = ()=>{ renderPlan(); sheet.classList.add("open"); };
document.getElementById("closeplan").onclick = ()=> sheet.classList.remove("open");
document.getElementById("copy").onclick = async e=>{
  try{ await navigator.clipboard.writeText(planText()); e.target.textContent = "Copied"; }
  catch(err){ e.target.textContent = "Copy blocked — select the text"; }
  setTimeout(()=>e.target.textContent="Copy as text",1600);
};
document.getElementById("backup").onclick = backup;
document.getElementById("restorebtn").onclick = ()=> document.getElementById("restorefile").click();
document.getElementById("restorefile").onchange = e=>{ if(e.target.files[0]) restore(e.target.files[0]); };
document.getElementById("reset").onclick = e=>{
  if(e.target.dataset.armed){
    state = {tier:{},note:{},seen:{},time:{},stage:{}}; save(); render(); renderPlan();
    delete e.target.dataset.armed; e.target.textContent = "Clear all picks";
  } else {
    e.target.dataset.armed = "1"; e.target.textContent = "Tap again to erase everything";
    setTimeout(()=>{ delete e.target.dataset.armed; e.target.textContent="Clear all picks"; },4000);
  }
};

load().then(render);
</script>
